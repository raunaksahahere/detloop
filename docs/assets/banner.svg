<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="t d">
  <title id="t">detloop</title>
  <desc id="d">detloop runs asyncio services inside a simulated world with virtual time, a simulated network, partitions and crashes, and replays any failure exactly from its seed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="0.55" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#1d1146"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="24" fill="url(#grid)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- wordmark -->
    <text x="72" y="130" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#word)">detloop</text>
    <text x="76" y="190" font-size="26" fill="#cbd5e1">Find the race once. Replay it from a seed.</text>
    <text x="76" y="224" font-size="19" fill="#94a3b8">Deterministic simulation testing for Python asyncio</text>

    <!-- pills -->
    <g font-size="13" font-weight="700" letter-spacing="0.8">
      <rect x="76" y="254" width="134" height="34" rx="17" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.7"/>
      <text x="143" y="276" text-anchor="middle" fill="#67e8f9">VIRTUAL TIME</text>
      <rect x="222" y="254" width="190" height="34" rx="17" fill="#818cf8" fill-opacity="0.14" stroke="#818cf8" stroke-opacity="0.8"/>
      <text x="317" y="276" text-anchor="middle" fill="#c7d2fe">PARTITIONS · CRASHES</text>
      <rect x="424" y="254" width="158" height="34" rx="17" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.8"/>
      <text x="503" y="276" text-anchor="middle" fill="#4ade80">ONE-SEED REPLAY</text>
    </g>

    <!-- simulated timeline: three nodes, a partition, a crash, the failure -->
    <g transform="translate(720 0)">
      <rect x="0" y="40" width="500" height="262" rx="14" fill="#0b1222" fill-opacity="0.75" stroke="#334155"/>
      <text x="20" y="70" font-size="13" font-weight="700" letter-spacing="1" fill="#94a3b8">SEED 17 · VIRTUAL TIME</text>
      <text x="480" y="70" font-size="13" text-anchor="end" fill="#64748b">0s → 6.5s</text>

      <g font-size="15" font-weight="600" fill="#e2e8f0">
        <text x="20" y="114">n1</text>
        <text x="20" y="158">n2</text>
        <text x="20" y="202">n3</text>
      </g>
      <!-- lanes -->
      <g fill="#1e293b">
        <rect x="60" y="100" width="420" height="20" rx="5"/>
        <rect x="60" y="144" width="420" height="20" rx="5"/>
        <rect x="60" y="188" width="420" height="20" rx="5"/>
      </g>
      <!-- partition band on n2 -->
      <rect x="196" y="138" width="170" height="32" rx="6" fill="#ef4444" fill-opacity="0.18" stroke="#f87171" stroke-opacity="0.55" stroke-dasharray="5 4"/>
      <!-- node up intervals -->
      <g fill="url(#up)">
        <rect x="60" y="104" width="190" height="12" rx="4"/>
        <rect x="318" y="104" width="162" height="12" rx="4"/>
        <rect x="60" y="148" width="420" height="12" rx="4"/>
        <rect x="60" y="192" width="420" height="12" rx="4"/>
      </g>
      <!-- crash marker on n1 -->
      <line x1="250" y1="96" x2="250" y2="124" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
      <text x="284" y="92" font-size="11" text-anchor="middle" fill="#fca5a5">crash · restart</text>
      <text x="281" y="186" font-size="11" text-anchor="middle" fill="#fca5a5">partition</text>
      <!-- leader notes -->
      <g fill="#a5b4fc">
        <circle cx="96" cy="110" r="4"/>
        <circle cx="342" cy="154" r="4"/>
      </g>
      <!-- the failure -->
      <line x1="446" y1="88" x2="446" y2="216" stroke="#f87171" stroke-width="2" stroke-dasharray="4 3"/>
      <rect x="20" y="232" width="460" height="52" rx="10" fill="#22c55e" fill-opacity="0.10" stroke="#22c55e" stroke-opacity="0.6"/>
      <text x="38" y="254" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0">$ detloop replay seed-17/manifest.json</text>
      <text x="38" y="274" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#4ade80">REPRODUCED · trace identical</text>
    </g>
  </g>
</svg>
